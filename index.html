<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="Rc37V0yUOlOQ63_Xbh2ZBifWdLH-hwXKErQ3B6YWxwU" />
  <title>NexGen CV – AI Powered CV Maker | Cortex Prime</title>
  <meta name="description" content="Sri Lanka's pioneering AI-driven CV builder. Create ATS-friendly resumes with Zephyr-7B.">
  <link rel="icon" href="https://huggingface.co/front/assets/huggingface_logo-noborder.svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Outfit',sans-serif;background:#050810;color:#e2e8f0;overflow:hidden}
    .loader{
      position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#050810;z-index:9999;transition:opacity .6s;
    }
    .logo{
      font-size:32px;font-weight:800;letter-spacing:.5px;margin-bottom:16px;
      background:linear-gradient(110deg,#fff 25%,#60a5fa 50%,#fff 75%);
      background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
      animation:shine 3s linear infinite;
    }
    @keyframes shine{to{background-position:200% center}}
    .logo span{color:#00ffd5}
    .tag{color:#94a3b8;font-size:13px;letter-spacing:3px;text-transform:uppercase}
    .spinner{
      width:44px;height:44px;border:3px solid rgba(96,165,250,.2);border-top-color:#60a5fa;
      border-radius:50%;animation:spin 1s linear infinite;margin-top:24px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:none;background:#050810}
    .hide{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="logo">cortex <span>prime</span></div>
    <div class="tag">CV MAKER WITH AI</div>
    <div class="spinner"></div>
  </div>
  
  <iframe 
    src="https://cortexprime-nexgen.hf.space"
    allow="clipboard-write"
    loading="eager"
    onload="document.getElementById('loader').classList.add('hide')"
    title="NexGen CV">
  </iframe>

  <script>
    // fallback hide loader after 5s
    setTimeout(()=>document.getElementById('loader').classList.add('hide'),5000);
  </script>
</body>
</html>
